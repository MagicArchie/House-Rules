	<a-scene
	  renderer="
			colorManagement: true;
			physicallyCorrectLights: true;
			exposure: 1.4;
			toneMapping: ACESFilmic;"
	>
	  <!-- =========================
		  PLAYER / CAMERA
	  ========================= -->

	  <a-entity
		id="player"
		position="0 0 -40"
		player-controls-custom="spawnLookY: 180;"
	  >
		<a-box
		  id="player-hitbox"
		  class="player-hitbox"
		  position="0 2.25 0"
		  width="1.1"
		  height="4.5"
		  depth="1.1"
		  material="
						color: red;
						transparent: true;
						opacity: 0.35;"
		>
		</a-box>

		<a-camera
		  id="camera"
		  look-controls="pointerLockEnabled: true"
		  wasd-controls="enabled: false"
		  position="0 4.0 0"
		>
		  <a-entity
			cursor="rayOrigin: center"
			raycaster="objects: .interactable; far: 6; showLine: false"
		  >
		  </a-entity>

		  <a-entity id="crosshair" position="0 0 -1">
			<a-entity
			  geometry="primitive: ring; radiusInner: 0.025; radiusOuter: 0.030"
			  material="color: white; shader: flat; opacity: 0.85; transparent: true"
			>
			</a-entity>

			<a-entity
			  id="crosshair-dot"
			  geometry="primitive: circle; radius: 0.006"
			  material="color: white; shader: flat"
			>
			</a-entity>
		  </a-entity>
		</a-camera>
	  </a-entity>

		  WORLD

	<div id="hud">

	  </div>

	  <section class="hud-panel hud-panel--cash">
		<img
		  class="hud-icon hud-icon--cash"
		  src="materials/images/HUD/Cash Icon.png"
		  alt="Cash"
		/>

		<div class="hud-panel__content hud-panel__content--cash">
		  <div class="hud-panel__label">MONEY:</div>
		  <div id="money-value" class="hud-panel__value">$0</div>
		</div>
	  </section>

	  <section id="token-panel" class="hud-panel hud-panel--token">
		<div class="hud-panel__title">SECRET ITEM:</div>

		<div class="hud-token-row">
		  <img
			id="token-icon"
			class="hud-icon hud-icon--token"
			src="materials/images/HUD/SecretItem Icon.png"
			alt="Secret Item"
		  />

		  <div id="token-name" class="hud-panel__value hud-panel__value--token">
			NOT FOUND
		  </div>
		</div>
	  </section>

	  <section class="hud-panel hud-panel--objective">
		<div class="hud-objective-header">
		  <img
			class="hud-icon hud-icon--objective"
			src="materials/images/HUD/Objective Icon.png"
			alt="Objective"
		  />

		  <div class="hud-panel__label">OBJECTIVE:</div>
		</div>

		<p class="hud-panel__text">
		  Collect as much money as you can and escape before security catches
		  you.
		</p>
	  </section>

	  <section class="hud-panel hud-panel--controls">
		<div class="hud-panel__label hud-panel__label--center">CONTROLS</div>

		<ul class="hud-controls-list">
		  <li>
			<img
			  class="control-icon control-icon--wasd"
			  src="materials/images/HUD/WASD Keys.png"
			  alt="WASD"
			/>
			<span class="control-text control-text--move">- MOVE</span>
		  </li>

		  <li>
			<img
			  class="control-icon control-icon--mouse"
			  src="materials/images/HUD/Mouse.png"
			  alt="Mouse"
			/>
			<span class="control-text control-text--look">- LOOK</span>
		  </li>

		  <li>
			<img
			  class="control-icon control-icon--interact"
			  src="materials/images/HUD/Interact.png"
			  alt="Interact"
			/>
			<span class="control-text control-text--interact">- INTERACT</span>
		  </li>

		  <li>
			<img
			  class="control-icon control-icon--shift"
			  src="materials/images/HUD/SHIFT Key.png"
			  alt="Shift"
			/>
			<span class="control-text control-text--sprint">- SPRINT</span>
		  </li>

		  <li>
			<img
			  class="control-icon control-icon--ctrl"
			  src="materials/images/HUD/CTRL Key.png"
			  alt="Ctrl"
			/>
			<span class="control-text control-text--crouch">- CROUCH</span>
		  </li>
		</ul>
	  </section>

		</div>
	  </section>
